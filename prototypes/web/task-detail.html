<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  // Applied before first paint to avoid a flash of the wrong theme --
  // js/api.js (loaded at the end of <body>) is far too late for this.
  // See applyTheme()/setThemeChoice() there for the picker itself.
  (function () {
    var t = localStorage.getItem("hnbg_theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  })();
</script>
<title>#TCK-3021 — HNBG</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .detail-wrap { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
  .detail-main {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    box-shadow: var(--shadow-sm);
  }
  .detail-side .panel { padding: 4px 0; }
  .side-block { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .side-block:last-child { border-bottom: none; }
  .side-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-tertiary); margin-bottom: 8px; }
  .breadcrumb { font-size: 13px; color: var(--text-tertiary); margin-bottom: 14px; }
  .breadcrumb a { color: var(--accent); }
  .comment { display: flex; gap: 10px; padding: 14px 0; border-top: 1px solid var(--border); }
  .comment-body { font-size: 13.5px; }
  .comment-meta { font-size: 12px; color: var(--text-tertiary); margin-bottom: 3px; }
  .side-select {
    width: 100%;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    font-size: 13.5px;
    font-family: inherit;
    background: var(--surface-alt);
    color: var(--text-primary);
  }
  .side-action-row { display: flex; gap: 8px; margin-top: 8px; }
  .side-action-row .btn { padding: 7px 12px; font-size: 12.5px; }
  .side-permission-note { font-size: 11.5px; color: var(--text-tertiary); margin-top: 6px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="hnbg-mark.png" alt="HNBG" class="brand-logo" />
      <div class="brand-text">
        <div class="brand-tagline"><span class="c-blue">Hokkaido</span> <span class="c-blue">Nepal</span> <span class="c-red">Business</span> <span class="c-red">Group</span></div>
        <div class="brand-subtitle"><span class="c-blue">HN</span><span class="c-red">BG</span> <span class="brand-tms">TMS</span></div>
      </div>
    </div>
    <nav class="nav-section">
      <div class="nav-label">Workspace</div>
      <a class="nav-item" href="dashboard.html">Dashboard</a>
      <a class="nav-item active" href="tasks.html">My Tasks <span class="count-badge" id="nav-mytasks-count">–</span></a>
      <a class="nav-item" href="board.html">Board</a>
      <a class="nav-item" href="calendar.html">Calendar</a>
      <a class="nav-item" href="timeline.html">Timeline</a>
    </nav>
    <nav class="nav-section" id="nav-admin-section" style="display:none">
      <div class="nav-label">System</div>
      <a class="nav-item" href="admin.html">Admin Panel</a>
    </nav>
    <div class="sidebar-footer">
      <a class="user-chip" href="my-profile.html" title="View profile"><div class="avatar" id="sidebar-avatar">TL</div><div class="user-meta"><div class="user-name" id="sidebar-name">Loading…</div><div class="user-role" id="sidebar-role">—</div></div></a>
      <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Theme">
        <button data-theme-choice="light" onclick="setThemeChoice('light')" title="Light">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button data-theme-choice="dark" onclick="setThemeChoice('dark')" title="Dark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <button data-theme-choice="system" onclick="setThemeChoice('system')" title="System">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
      </div>
      <button class="sidebar-signout-btn" onclick="logout()" title="Sign out"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Task Detail</div>
      <div class="topbar-right">
        <button class="btn btn-secondary" onclick="location.href='tasks.html'">Close</button>
      </div>
    </header>

    <div class="content" id="detail-content">
      <div style="padding:32px;text-align:center;color:var(--text-tertiary)">Loading task…</div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
requireAuth();

const taskId = new URLSearchParams(location.search).get('id');
let usersCache = null;
let currentTask = null;
let currentUser = null;

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
  const days = Math.round(hours / 24);
  return `${days} day${days === 1 ? '' : 's'} ago`;
}

function renderComment(c) {
  return `
    <div class="comment">
      <div class="avatar-sm" style="background:${avatarColor(c.author)};flex-shrink:0">${avatarInitials(c.author)}</div>
      <div class="comment-body">
        <div class="comment-meta">${c.author.fullName} · ${timeAgo(c.createdAt)}</div>
        ${c.body}
      </div>
    </div>
  `;
}

function formatFileSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function renderAttachment(a) {
  return `
    <div class="attachment-chip">
      <span class="attachment-chip-name">${a.fileName}</span>
      <span class="attachment-chip-size">${formatFileSize(a.fileSizeBytes)} · ${a.uploadedBy.fullName} · ${timeAgo(a.createdAt)}</span>
      <button type="button" class="icon-action-btn" title="Download" onclick="handleDownloadAttachment('${a.id}', '${a.fileName.replace(/'/g, "\\'")}', '${a.contentType}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      </button>
      <button type="button" class="attachment-chip-remove" title="Delete" onclick="handleDeleteAttachment('${a.id}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  `;
}

/** Unlike create-task.html's staging (no task exists yet), Task Detail
 * already has a real task id — each picked file uploads immediately,
 * one at a time, then the task is refetched so the new attachment(s)
 * show up via the normal render path. */
async function handleDetailAttachmentsSelected(e) {
  const files = [...e.target.files];
  e.target.value = '';
  const failed = [];
  for (const file of files) {
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read that file.'));
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
      });
      await Api.addTaskAttachment(taskId, file.name, file.type || 'application/octet-stream', base64);
    } catch (err) {
      failed.push(file.name);
    }
  }
  if (failed.length > 0) alert(`Couldn't attach: ${failed.join(', ')}`);
  await loadTask();
}

async function handleDownloadAttachment(id, fileName, contentType) {
  try {
    const base64 = await Api.taskAttachmentContent(id);
    const link = document.createElement('a');
    link.href = `data:${contentType};base64,${base64}`;
    link.download = fileName;
    link.click();
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    alert(`Couldn't download: ${err.message}`);
  }
}

async function handleDeleteAttachment(id) {
  try {
    await Api.deleteTaskAttachment(id);
    await loadTask();
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    alert(`Couldn't delete: ${err.message}`);
  }
}

async function populateAssigneeSelect(task) {
  const select = document.getElementById('assignee-select');
  if (!select) return;
  try {
    if (!usersCache) usersCache = await Api.users();
    // See create-task.html's identical comment — this is UX only, the
    // server enforces the real rule (can_assign_task_to in
    // permissions.py) regardless of what options were offered here.
    // Always keeps the task's *current* assignee in the list even if
    // they wouldn't be a valid *new* choice (e.g. a Manager assigned
    // before this restriction existed) — otherwise the dropdown would
    // silently show a different person than who the task is actually
    // assigned to.
    const assignable = usersCache.filter(
      u => isValidAssigneeForMember(currentUser, u) || (task.assignee && u.id === task.assignee.id)
    );
    select.innerHTML =
      '<option value="">Unassigned</option>' +
      assignable.map(u => `<option value="${u.id}" ${task.assignee && u.id === task.assignee.id ? 'selected' : ''}>${u.fullName}</option>`).join('');
  } catch (err) {
    // Non-fatal — reassigning just won't have a full list to pick from.
    console.error('Failed to load users for reassignment:', err);
  }
}

async function handleStatusUpdate() {
  const status = document.getElementById('status-select').value;
  await applyStatusChange(status);
}

async function handleCloseTicket() {
  await applyStatusChange('DONE');
}

async function applyStatusChange(status) {
  try {
    await Api.changeTaskStatus(taskId, status);
    await loadTask();
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    alert(`Couldn't update status: ${err.message}`);
  }
}

async function handleAssigneeUpdate() {
  const assigneeId = document.getElementById('assignee-select').value;
  try {
    await Api.assignTask(taskId, assigneeId || null);
    await loadTask();
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    alert(`Couldn't reassign: ${err.message}`);
  }
}

function renderTask(task) {
  currentTask = task;
  const statusClass = STATUS_CLASS[task.status] || 'pending';
  const statusLabel = STATUS_LABEL[task.status] || task.status;
  const priorityClass = PRIORITY_CLASS[task.priority] || 'priority-low';
  const priorityLabel = PRIORITY_LABEL[task.priority] || task.priority;
  const opened = new Date(task.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

  document.title = `#${task.ticketNo} — HNBG`;

  document.getElementById('detail-content').innerHTML = `
    <div class="breadcrumb"><a href="tasks.html">My Tasks</a> / #${task.ticketNo}</div>

    <div class="detail-wrap">
      <div class="detail-main">
        <span class="status-chip ${statusClass}" style="margin-bottom:14px;display:inline-flex">● ${statusLabel}</span>
        <h1 style="font-size:22px;font-weight:700;letter-spacing:-0.01em;margin:0 0 8px">${task.title}</h1>
        <div style="color:var(--text-tertiary);font-size:13px;margin-bottom:24px">#${task.ticketNo} · ${task.department.name}${task.branch ? ' · ' + task.branch.name : ''} · Opened ${opened}</div>

        <p style="color:var(--text-secondary);line-height:1.6;font-size:14.5px">
          ${task.description || '<span style="color:var(--text-tertiary)">No description provided.</span>'}
        </p>

        <div style="margin-top:28px">
          <div class="side-label" style="margin-bottom:10px">Attachments</div>
          <div id="attachment-list" style="display:flex;flex-direction:column;gap:6px">
            ${task.attachments.length ? task.attachments.map(renderAttachment).join('') : '<div style="color:var(--text-tertiary);font-size:13px;padding:4px 0 10px">No files attached yet.</div>'}
          </div>
          <button type="button" class="btn btn-secondary" style="margin-top:10px" onclick="document.getElementById('detail-attachment-input').click()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            Attach file
          </button>
          <input type="file" id="detail-attachment-input" multiple style="display:none" onchange="handleDetailAttachmentsSelected(event)" />
        </div>

        <div style="margin-top:28px">
          <div class="side-label" style="margin-bottom:10px">Activity</div>
          <div id="comment-list">
            ${task.comments.length ? task.comments.map(renderComment).join('') : '<div style="color:var(--text-tertiary);font-size:13px;padding:10px 0">No comments yet.</div>'}
          </div>
          <form id="comment-form" style="display:flex;gap:8px;margin-top:16px" onsubmit="return handleAddComment(event)">
            <input id="comment-body" type="text" placeholder="Add a comment…" style="flex:1;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface-alt);color:var(--text-primary);font-size:13.5px;font-family:inherit;outline:none" />
            <button type="submit" class="btn btn-secondary">Post</button>
          </form>
        </div>
      </div>

      <div class="detail-side">
        <div class="panel">
          <div class="side-block">
            <div class="side-label">Status</div>
            <select id="status-select" class="side-select">
              ${["PENDING", "IN_PROGRESS", "REVIEW", "DONE"]
                .map((s) => `<option value="${s}" ${s === task.status ? "selected" : ""}>${STATUS_LABEL[s]}</option>`)
                .join("")}
            </select>
            <div class="side-action-row">
              <button class="btn btn-secondary" onclick="handleStatusUpdate()">Update Status</button>
              ${task.status !== "DONE" ? '<button class="btn btn-primary" onclick="handleCloseTicket()">Close Ticket</button>' : ""}
            </div>
            <div class="side-permission-note">Only the assignee, reporter, an admin, or a manager in this department can change status.</div>
          </div>

          <div class="side-block">
            <div class="side-label">Assignee</div>
            <select id="assignee-select" class="side-select">
              <option value="">Unassigned</option>
            </select>
            <div class="side-action-row">
              <button class="btn btn-secondary" onclick="handleAssigneeUpdate()">Reassign</button>
            </div>
          </div>

          <div class="side-block">
            <div class="side-label">Priority</div>
            <span class="priority-tag ${priorityClass}">${priorityLabel}</span>
          </div>
          <div class="side-block">
            <div class="side-label">Due Date</div>
            ${formatDueDate(task.dueAt, task.isOverdue)}
          </div>
          <div class="side-block">
            <div class="side-label">Department</div>
            <div style="font-size:13.5px;font-weight:500">${task.department.name}</div>
          </div>
          <div class="side-block">
            <div class="side-label">Reporter</div>
            <div class="assignee-cell"><div class="avatar-sm" style="background:${avatarColor(task.reporter)}">${avatarInitials(task.reporter)}</div>${task.reporter.fullName}</div>
          </div>
        </div>
      </div>
    </div>
  `;

  populateAssigneeSelect(task);
}

async function loadTask() {
  if (!taskId) {
    document.getElementById('detail-content').innerHTML =
      '<div style="padding:32px;text-align:center;color:var(--danger)">No task selected. Go back to <a href="tasks.html">My Tasks</a>.</div>';
    return;
  }
  try {
    const task = await Api.task(taskId);
    if (!task) {
      document.getElementById('detail-content').innerHTML =
        '<div style="padding:32px;text-align:center;color:var(--danger)">Task not found.</div>';
      return;
    }
    renderTask(task);
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    document.getElementById('detail-content').innerHTML =
      `<div style="padding:32px;text-align:center;color:var(--danger)">Couldn't load task: ${err.message}</div>`;
  }
}

async function handleAddComment(e) {
  e.preventDefault();
  const input = document.getElementById('comment-body');
  const body = input.value.trim();
  if (!body) return false;

  try {
    await Api.addComment(taskId, body);
    input.value = '';
    await loadTask();
  } catch (err) {
    alert(`Couldn't post comment: ${err.message}`);
  }
  return false;
}

(async function initSidebar() {
  try {
    const me = await Api.me();
    currentUser = me;
    if (!me.profileCompletedAt) {
      location.href = 'my-profile.html';
      return;
    }
    document.getElementById('sidebar-name').textContent = me.fullName;
    document.getElementById('sidebar-role').textContent = me.department ? me.department.name : me.role;
    setSidebarAvatar(me);
    if (me.role === 'ADMIN' || me.role === 'MANAGER') document.getElementById('nav-admin-section').style.display = '';
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
  }
  Api.myTasksBadgeCount()
    .then(count => { document.getElementById('nav-mytasks-count').textContent = count; })
    .catch(() => {});
  loadTask();
})();
</script>
</body>
</html>
