<div class="kanban-toast" id="kanban-toast"></div>

<script src="js/api.js"></script>
<script>
requireAuth();

const COLUMNS = [
  { status: 'PENDING', label: 'Pending', dotClass: 'pending' },
  { status: 'IN_PROGRESS', label: 'In Progress', dotClass: 'progress' },
  { status: 'REVIEW', label: 'Review', dotClass: 'review' },
  { status: 'DONE', label: 'Done', dotClass: 'done' },
];

let workloads = [];   // [{ openTaskCount, user }]
let toastTimer = null;

function showToast(message) {
  const el = document.getElementById('kanban-toast');
  el.textContent = message;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visible'), 4000);
}

function assigneeOptionsHtml(selectedId) {
  const opts = ['<option value="">Unassigned</option>'];
  for (const w of workloads) {
    const selected = w.user.id === selectedId ? ' selected' : '';
    opts.push(`<option value="${w.user.id}"${selected}>${w.user.fullName} (${w.openTaskCount} open)</option>`);
  }
  return opts.join('');
}

function cardHtml(task) {
  const priorityClass = PRIORITY_CLASS[task.priority] || 'priority-low';
  const priorityLabel = PRIORITY_LABEL[task.priority] || task.priority;
  return `
    <div class="kanban-card" draggable="true" data-task-id="${task.id}" data-status="${task.status}" onclick="location.href='task-detail.html?id=${task.id}'">
      <div class="kanban-card-ticket">#${task.ticketNo}</div>
      <div class="kanban-card-title">${task.title}</div>
      <div class="kanban-card-foot">
        <span class="priority-tag ${priorityClass}">${priorityLabel}</span>
        <select class="kanban-assignee-select" data-task-id="${task.id}" onclick="event.stopPropagation()" onchange="handleAssigneeChange(event)">
          ${assigneeOptionsHtml(task.assignee ? task.assignee.id : null)}
        </select>
      </div>
    </div>
  `;
}

function renderBoard(tasks) {
  const board = document.getElementById('kanban-board');
  board.innerHTML = COLUMNS.map(col => {
    const colTasks = tasks.filter(t => t.status === col.status);
    return `
      <div class="kanban-column">
        <div class="kanban-column-head">
          <div class="kanban-column-title"><span class="status-dot ${col.dotClass}"></span>${col.label}</div>
          <span class="kanban-column-count">${colTasks.length}</span>
        </div>
        <div class="kanban-column-body" data-status="${col.status}">
          ${colTasks.map(cardHtml).join('')}
        </div>
      </div>
    `;
  }).join('');

  wireDragAndDrop();
}

function updateColumnCounts() {
  document.querySelectorAll('.kanban-column').forEach(col => {
    const count = col.querySelectorAll('.kanban-card').length;
    col.querySelector('.kanban-column-count').textContent = count;
  });
}

function wireDragAndDrop() {
  document.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      if (card.dataset.syncing === '1') { e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', card.dataset.taskId);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });

  document.querySelectorAll('.kanban-column-body').forEach(body => {
    body.addEventListener('dragover', (e) => {
      e.preventDefault();
      body.classList.add('drag-over');
    });
    body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
    body.addEventListener('drop', (e) => {
      e.preventDefault();
      body.classList.remove('drag-over');
      const taskId = e.dataTransfer.getData('text/plain');
      const card = document.querySelector(`.kanban-card[data-task-id="${taskId}"]`);
      if (!card) return;
      const newStatus = body.dataset.status;
      const oldStatus = card.dataset.status;
      if (newStatus === oldStatus) return;
      const fromBody = card.parentElement;
      moveCard(taskId, newStatus, card, fromBody, body);
    });
  });
}

async function moveCard(taskId, newStatus, cardEl, fromBody, toBody) {
  const oldStatus = cardEl.dataset.status;
  cardEl.dataset.syncing = '1';
  cardEl.classList.add('is-syncing');
  toBody.appendChild(cardEl);          // optimistic move
  cardEl.dataset.status = newStatus;
  updateColumnCounts();

  try {
    await Api.changeTaskStatus(taskId, newStatus);
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    fromBody.appendChild(cardEl);      // rollback
    cardEl.dataset.status = oldStatus;
    updateColumnCounts();
    showToast(`Couldn't move #${cardEl.querySelector('.kanban-card-ticket').textContent.slice(1)}: ${err.message}`);
  } finally {
    cardEl.dataset.syncing = '0';
    cardEl.classList.remove('is-syncing');
  }
}

async function handleAssigneeChange(e) {
  const select = e.target;
  const taskId = select.dataset.taskId;
  const newAssigneeId = select.value || null;

  select.disabled = true;
  try {
    await Api.assignTask(taskId, newAssigneeId);
    // Reflect the reassignment in local workload counts without a full
    // reload, so consecutive reassigns on the same board see fresh counts.
    workloads.forEach(w => {
      if (w.user.id === newAssigneeId) w.openTaskCount += 1;
      else if (w.user.id === select.dataset.previousAssignee) w.openTaskCount = Math.max(0, w.openTaskCount - 1);
    });
    select.dataset.previousAssignee = newAssigneeId || '';
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    select.value = select.dataset.previousAssignee || '';
    showToast(`Couldn't reassign: ${err.message}`);
  } finally {
    select.disabled = false;
  }
}

async function loadBoard() {
  const boardEl = document.getElementById('kanban-board');
  try {
    const [tasks, workloadResult] = await Promise.all([Api.boardTasks(), Api.userWorkloads()]);
    workloads = workloadResult;
    renderBoard(tasks);
    document.querySelectorAll('.kanban-assignee-select').forEach(sel => {
      sel.dataset.previousAssignee = sel.value;
    });
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    boardEl.innerHTML = `<div style="padding:32px;color:var(--danger)">Couldn't load the board: ${err.message}</div>`;
  }
}

(async function init() {
  try {
    const me = await Api.me();
    document.getElementById('sidebar-name').textContent = me.fullName;
    document.getElementById('sidebar-role').textContent = me.department ? me.department.name : me.role;
    setSidebarAvatar(me);
    if (me.role === 'ADMIN' || me.role === 'MANAGER') document.getElementById('nav-admin-section').style.display = '';
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
  }
  Api.myTasksBadgeCount()
    .then(count => { document.getElementById('nav-mytasks-count').textContent = count; })
    .catch(() => {});
  loadBoard();
})();
</script>
</body>
