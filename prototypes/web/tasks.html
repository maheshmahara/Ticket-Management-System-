<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  // Applied before first paint to avoid a flash of the wrong theme --
  // js/api.js (loaded at the end of <body>) is far too late for this.
  // See applyTheme()/setThemeChoice() there for the picker itself.
  (function () {
    var t = localStorage.getItem("hnbg_theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  })();
</script>
<title>My Tasks — HNBG</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img src="hnbg-mark.png" alt="HNBG" class="brand-logo" />
      <div class="brand-text">
        <div class="brand-tagline"><span class="c-blue">Hokkaido</span> <span class="c-blue">Nepal</span> <span class="c-red">Business</span> <span class="c-red">Group</span></div>
        <div class="brand-subtitle"><span class="c-blue">HN</span><span class="c-red">BG</span> <span class="brand-tms">TMS</span></div>
      </div>
    </div>

    <nav class="nav-section">
      <div class="nav-label">Workspace</div>
      <a class="nav-item" href="dashboard.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a class="nav-item active" href="tasks.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        My Tasks
        <span class="count-badge" id="nav-mytasks-count">–</span>
      </a>
      <a class="nav-item" href="board.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="5" height="13" rx="1"/></svg>
        Board
      </a>
      <a class="nav-item" href="calendar.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendar
      </a>
      <a class="nav-item" href="timeline.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Timeline
      </a>
    </nav>

    <nav class="nav-section" id="nav-admin-section" style="display:none">
      <div class="nav-label">System</div>
      <a class="nav-item" href="admin.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 8v4l3 3"/></svg>
        Admin Panel
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="user-chip" href="my-profile.html" title="View profile">
        <div class="avatar" id="sidebar-avatar">TL</div>
        <div class="user-meta">
          <div class="user-name" id="sidebar-name">Loading…</div>
          <div class="user-role" id="sidebar-role">—</div>
        </div>
      </a>
      <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Theme">
        <button data-theme-choice="light" onclick="setThemeChoice('light')" title="Light">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button data-theme-choice="dark" onclick="setThemeChoice('dark')" title="Dark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <button data-theme-choice="system" onclick="setThemeChoice('system')" title="System">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
      </div>
      <button class="sidebar-signout-btn" onclick="logout()" title="Sign out">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="page-title">My Tasks</div>
      <div class="topbar-right">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="topbar-search-input" placeholder="Search tickets, people..." autocomplete="off" />
          <div class="search-results" id="topbar-search-results" style="display:none"></div>
        </div>
        <button class="btn btn-primary" onclick="location.href='create-task.html'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Create Task
        </button>
      </div>
    </header>

    <div class="content">

      <div class="toolbar">
        <div class="filter-pills" id="filter-pills">
          <button class="pill active" data-status="">All</button>
          <button class="pill" data-status="PENDING">Pending</button>
          <button class="pill" data-status="IN_PROGRESS">In Progress</button>
          <button class="pill" data-status="REVIEW">Review</button>
          <button class="pill" data-status="DONE">Done</button>
        </div>
        <div class="view-toggle">
          <button class="active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            List
          </button>
          <button onclick="location.href='board.html'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>
            Board
          </button>
        </div>
      </div>

      <div class="bulk-toolbar" id="bulk-toolbar" style="display:none">
        <span id="bulk-count">0 selected</span>
        <select id="bulk-status">
          <option value="">Change status…</option>
          <option value="PENDING">Pending</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="REVIEW">Review</option>
          <option value="DONE">Done</option>
        </select>
        <select id="bulk-priority">
          <option value="">Change priority…</option>
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="URGENT">Urgent</option>
        </select>
        <select id="bulk-assignee">
          <option value="">Reassign to…</option>
        </select>
        <button class="btn btn-ghost" id="bulk-clear" onclick="clearSelection()">Clear selection</button>
      </div>
      <div class="bulk-result" id="bulk-result" style="display:none"></div>

      <div class="table-panel">
        <div class="table-head">
          <input type="checkbox" id="select-all" class="row-checkbox" onchange="toggleSelectAll(this.checked)" />
          <span>Ticket No</span>
          <span>Title</span>
          <span>Status</span>
          <span>Assignee</span>
          <span>Due Date</span>
          <span>Priority</span>
          <span></span>
        </div>

        <div id="task-rows">
          <div style="padding:32px;text-align:center;color:var(--text-tertiary)">Loading tasks…</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
requireAuth();

const params = new URLSearchParams(location.search);
// dashboard.html's status tiles link here with a lowercase ?status=
// (matching the original mockup's status-chip class names, e.g.
// "overdue"/"progress"/"pending"/"done") — map those onto the
// GraphQL TaskStatus enum. "overdue" isn't a stored status (it's
// computed from dueAt), so it's handled client-side after fetching
// instead of as a server-side filter.
const STATUS_PARAM_MAP = { pending: 'PENDING', progress: 'IN_PROGRESS', done: 'DONE' };
const initialStatusParam = params.get('status');
let activeStatus = STATUS_PARAM_MAP[initialStatusParam] || '';
let showOverdueOnly = initialStatusParam === 'overdue';

const selectedIds = new Set();

function updateBulkToolbar() {
  document.getElementById('bulk-toolbar').style.display = selectedIds.size > 0 ? '' : 'none';
  document.getElementById('bulk-count').textContent = `${selectedIds.size} selected`;
}

function toggleRowSelection(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  const allBoxes = document.querySelectorAll('.row-checkbox[data-id]');
  document.getElementById('select-all').checked =
    allBoxes.length > 0 && selectedIds.size === allBoxes.length;
  updateBulkToolbar();
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.row-checkbox[data-id]').forEach(cb => {
    cb.checked = checked;
    if (checked) selectedIds.add(cb.dataset.id); else selectedIds.delete(cb.dataset.id);
  });
  updateBulkToolbar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = false);
  updateBulkToolbar();
}

async function runBulkAction(input) {
  const selects = ['bulk-status', 'bulk-priority', 'bulk-assignee'].map(id => document.getElementById(id));
  const resultEl = document.getElementById('bulk-result');
  selects.forEach(s => s.disabled = true);
  resultEl.style.display = '';
  resultEl.style.color = 'var(--text-secondary)';
  resultEl.textContent = 'Updating…';

  try {
    const result = await Api.bulkUpdateTasks(Array.from(selectedIds), input);
    resultEl.textContent = result.failures.length
      ? `${result.successCount} updated, ${result.failures.length} skipped (no permission).`
      : `${result.successCount} updated.`;
    clearSelection();
    await loadTasks();
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    resultEl.style.color = 'var(--danger)';
    resultEl.textContent = `Couldn't update: ${err.message}`;
  } finally {
    selects.forEach(s => { s.disabled = false; s.value = ''; });
  }
}

function renderRow(task) {
  const assignee = task.assignee;
  const statusClass = STATUS_CLASS[task.status] || 'pending';
  const statusLabel = STATUS_LABEL[task.status] || task.status;
  const priorityClass = PRIORITY_CLASS[task.priority] || 'priority-low';
  const priorityLabel = PRIORITY_LABEL[task.priority] || task.priority;

  return `
    <div class="table-row" onclick="location.href='task-detail.html?id=${task.id}'">
      <input type="checkbox" class="row-checkbox" data-id="${task.id}" ${selectedIds.has(task.id) ? 'checked' : ''}
        onclick="event.stopPropagation()" onchange="toggleRowSelection('${task.id}', this.checked)" />
      <div class="ticket-no">#${task.ticketNo}</div>
      <div class="ticket-title-cell"><div class="ticket-title">${task.title}</div></div>
      <span class="status-chip ${statusClass}">● ${statusLabel}</span>
      <div class="assignee-cell">
        ${assignee
          ? `<div class="avatar-sm" style="background:${avatarColor(assignee)}">${avatarInitials(assignee)}</div>${assignee.fullName}`
          : `<span style="color:var(--text-tertiary)">Unassigned</span>`}
      </div>
      ${formatDueDate(task.dueAt, task.isOverdue)}
      <span class="priority-tag ${priorityClass}">${priorityLabel}</span>
      <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  `;
}

async function loadTasks() {
  const rowsEl = document.getElementById('task-rows');
  rowsEl.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-tertiary)">Loading tasks…</div>';

  try {
    const filter = activeStatus ? { status: activeStatus } : null;
    const result = await Api.tasks(filter);
    let tasks = result.edges.map(e => e.node);
    if (showOverdueOnly) tasks = tasks.filter(t => t.isOverdue);

    rowsEl.innerHTML = tasks.length
      ? tasks.map(renderRow).join('')
      : '<div style="padding:32px;text-align:center;color:var(--text-tertiary)">No tasks match this filter.</div>';
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    rowsEl.innerHTML = `<div style="padding:32px;text-align:center;color:var(--danger)">Couldn't load tasks: ${err.message}</div>`;
  }
}

document.getElementById('filter-pills').addEventListener('click', (e) => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  document.querySelectorAll('#filter-pills .pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  activeStatus = btn.dataset.status;
  showOverdueOnly = false;
  loadTasks();
});

document.getElementById('bulk-status').addEventListener('change', (e) => {
  if (!e.target.value) return;
  runBulkAction({ status: e.target.value });
});
document.getElementById('bulk-priority').addEventListener('change', (e) => {
  if (!e.target.value) return;
  runBulkAction({ priority: e.target.value });
});
document.getElementById('bulk-assignee').addEventListener('change', (e) => {
  if (!e.target.value) return;
  runBulkAction({ assigneeId: e.target.value });
});

(async function init() {
  try {
    const me = await Api.me();
    if (!me.profileCompletedAt) {
      location.href = 'my-profile.html';
      return;
    }
    document.getElementById('sidebar-name').textContent = me.fullName;
    document.getElementById('sidebar-role').textContent = me.department ? me.department.name : me.role;
    setSidebarAvatar(me);
    if (me.role === 'ADMIN' || me.role === 'MANAGER') document.getElementById('nav-admin-section').style.display = '';
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
  }
  Api.myTasksBadgeCount()
    .then(count => { document.getElementById('nav-mytasks-count').textContent = count; })
    .catch(() => {});
  Api.users()
    .then(users => {
      const select = document.getElementById('bulk-assignee');
      select.insertAdjacentHTML('beforeend', users.map(u => `<option value="${u.id}">${u.fullName}</option>`).join(''));
    })
    .catch(() => {}); // non-fatal — bulk reassign just won't have options to pick from
  loadTasks();
})();
</script>
</body>
</html>
