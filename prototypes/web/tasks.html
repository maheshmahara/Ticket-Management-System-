<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Tasks — HNBG</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img src="hnbg-mark.png" alt="HNBG" class="brand-logo" />
      <div class="brand-text">
        <div class="brand-tagline"><span class="c-blue">Hokkaido</span> <span class="c-blue">Nepal</span> <span class="c-red">Business</span> <span class="c-red">Group</span></div>
        <div class="brand-subtitle"><span class="c-blue">HN</span><span class="c-red">BG</span> <span class="brand-tms">TMS</span></div>
      </div>
    </div>

    <nav class="nav-section">
      <div class="nav-label">Workspace</div>
      <a class="nav-item" href="dashboard.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a class="nav-item active" href="tasks.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        My Tasks
        <span class="count-badge" id="nav-mytasks-count">–</span>
      </a>
      <a class="nav-item" href="#">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendar
      </a>
      <a class="nav-item" href="#">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Timeline
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip" onclick="logout()" style="cursor:pointer" title="Sign out">
        <div class="avatar" id="sidebar-avatar">TL</div>
        <div class="user-meta">
          <div class="user-name" id="sidebar-name">Loading…</div>
          <div class="user-role" id="sidebar-role">—</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="page-title">My Tasks</div>
      <div class="topbar-right">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Search tickets, people..." />
        </div>
        <button class="btn btn-primary" onclick="location.href='create-task.html'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Create Task
        </button>
      </div>
    </header>

    <div class="content">

      <div class="toolbar">
        <div class="filter-pills" id="filter-pills">
          <button class="pill active" data-status="">All</button>
          <button class="pill" data-status="PENDING">Pending</button>
          <button class="pill" data-status="IN_PROGRESS">In Progress</button>
          <button class="pill" data-status="REVIEW">Review</button>
          <button class="pill" data-status="DONE">Done</button>
        </div>
        <div class="view-toggle">
          <button class="active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            List
          </button>
          <button>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>
            Board
          </button>
        </div>
      </div>

      <div class="table-panel">
        <div class="table-head">
          <span></span>
          <span>Ticket No</span>
          <span>Title</span>
          <span>Status</span>
          <span>Assignee</span>
          <span>Due Date</span>
          <span>Priority</span>
          <span></span>
        </div>

        <div id="task-rows">
          <div style="padding:32px;text-align:center;color:var(--text-tertiary)">Loading tasks…</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
requireAuth();

const params = new URLSearchParams(location.search);
// dashboard.html's status tiles link here with a lowercase ?status=
// (matching the original mockup's status-chip class names, e.g.
// "overdue"/"progress"/"pending"/"done") — map those onto the
// GraphQL TaskStatus enum. "overdue" isn't a stored status (it's
// computed from dueAt), so it's handled client-side after fetching
// instead of as a server-side filter.
const STATUS_PARAM_MAP = { pending: 'PENDING', progress: 'IN_PROGRESS', done: 'DONE' };
const initialStatusParam = params.get('status');
let activeStatus = STATUS_PARAM_MAP[initialStatusParam] || '';
let showOverdueOnly = initialStatusParam === 'overdue';

function renderRow(task) {
  const assignee = task.assignee;
  const statusClass = STATUS_CLASS[task.status] || 'pending';
  const statusLabel = STATUS_LABEL[task.status] || task.status;
  const priorityClass = PRIORITY_CLASS[task.priority] || 'priority-low';
  const priorityLabel = PRIORITY_LABEL[task.priority] || task.priority;

  return `
    <div class="table-row" onclick="location.href='task-detail.html?id=${task.id}'">
      <div class="checkbox"></div>
      <div class="ticket-no">#${task.ticketNo}</div>
      <div class="ticket-title-cell"><div class="ticket-title">${task.title}</div></div>
      <span class="status-chip ${statusClass}">● ${statusLabel}</span>
      <div class="assignee-cell">
        ${assignee
          ? `<div class="avatar-sm" style="background:${avatarColor(assignee)}">${avatarInitials(assignee)}</div>${assignee.fullName}`
          : `<span style="color:var(--text-tertiary)">Unassigned</span>`}
      </div>
      ${formatDueDate(task.dueAt, task.isOverdue)}
      <span class="priority-tag ${priorityClass}">${priorityLabel}</span>
      <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  `;
}

async function loadTasks() {
  const rowsEl = document.getElementById('task-rows');
  rowsEl.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-tertiary)">Loading tasks…</div>';

  try {
    const filter = activeStatus ? { status: activeStatus } : null;
    const result = await Api.tasks(filter);
    let tasks = result.edges.map(e => e.node);
    if (showOverdueOnly) tasks = tasks.filter(t => t.isOverdue);

    rowsEl.innerHTML = tasks.length
      ? tasks.map(renderRow).join('')
      : '<div style="padding:32px;text-align:center;color:var(--text-tertiary)">No tasks match this filter.</div>';
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
    rowsEl.innerHTML = `<div style="padding:32px;text-align:center;color:var(--danger)">Couldn't load tasks: ${err.message}</div>`;
  }
}

document.getElementById('filter-pills').addEventListener('click', (e) => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  document.querySelectorAll('#filter-pills .pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  activeStatus = btn.dataset.status;
  showOverdueOnly = false;
  loadTasks();
});

(async function init() {
  try {
    const me = await Api.me();
    document.getElementById('sidebar-name').textContent = me.fullName;
    document.getElementById('sidebar-role').textContent = me.department ? me.department.name : me.role;
    document.getElementById('sidebar-avatar').textContent = me.initials;
    document.getElementById('sidebar-avatar').style.background = me.avatarColor;
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return;
    }
  }
  Api.myTasksBadgeCount()
    .then(count => { document.getElementById('nav-mytasks-count').textContent = count; })
    .catch(() => {});
  loadTasks();
})();
</script>
</body>
</html>
