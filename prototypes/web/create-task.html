<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  // Applied before first paint to avoid a flash of the wrong theme --
  // js/api.js (loaded at the end of <body>) is far too late for this.
  // See applyTheme()/setThemeChoice() there for the picker itself.
  (function () {
    var t = localStorage.getItem("hnbg_theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  })();
</script>
<title>Create Task — HNBG</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body style="background:var(--bg)">

<div class="modal-overlay" style="position:static; background:none; backdrop-filter:none; min-height:100vh; align-items:center;">
  <div class="modal-card" style="max-width:600px;">
    <div class="modal-header" style="border-bottom:none;padding-bottom:0">
      <div class="aform-header">
        <div class="aform-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div>
          <div class="aform-title">Create New Task</div>
          <div class="aform-subtitle">Set details, ownership, and target timelines.</div>
        </div>
      </div>
      <button class="modal-close" onclick="location.href='tasks.html'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <form id="create-task-form" novalidate onsubmit="return handleCreateTaskSubmit(event)">

        <!-- Task Details -->
        <div class="aform-group">
          <div class="aform-field" id="title-field">
            <input id="title" type="text" placeholder=" " oninput="clearTitleError()" />
            <label for="title">Task Title</label>
          </div>
          <div class="aform-field">
            <textarea id="desc" rows="1" placeholder=" " oninput="autoExpand(this)" style="padding-right:36px"></textarea>
            <label for="desc">Description</label>
            <button type="button" class="aform-attach-btn" onclick="document.getElementById('attachment-input').click()" title="Attach file">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="attachment-input" multiple style="display:none" onchange="handleAttachmentsSelected(event)" />
            <div id="staged-attachments" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
          </div>
        </div>
        <div id="title-error" class="aform-error" style="display:none;padding:0 4px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          Task title is required.
        </div>

        <!-- Configuration & Metadata -->
        <div class="aform-group">
          <div class="aform-field is-static">
            <select id="department">
              <option value="">Loading…</option>
            </select>
            <label for="department">Department</label>
            <svg class="aform-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>

          <div class="aform-field is-static">
            <select id="branch">
              <option value="">Loading…</option>
            </select>
            <label for="branch">Branch</label>
            <svg class="aform-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>

          <div>
            <div class="aform-section-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V15"/></svg>
              Priority
            </div>
            <div class="aform-priority" role="radiogroup" aria-label="Priority level">
              <button type="button" class="active" onclick="selectPriority(this,'low')"><span class="p-dot" style="background:var(--neutral)"></span>Low</button>
              <button type="button" onclick="selectPriority(this,'medium')"><span class="p-dot" style="background:var(--warning)"></span>Medium</button>
              <button type="button" onclick="selectPriority(this,'high')"><span class="p-dot" style="background:#ff9500"></span>High</button>
              <button type="button" onclick="selectPriority(this,'urgent')"><span class="p-dot" style="background:var(--danger)"></span>Urgent</button>
            </div>
          </div>

          <div class="aform-field is-static">
            <input id="start-date" type="date" placeholder=" " />
            <label for="start-date">Start Date</label>
            <svg class="aform-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>

          <div class="aform-field is-static">
            <input id="due" type="datetime-local" placeholder=" " />
            <label for="due">Due Date &amp; Time</label>
            <svg class="aform-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>

          <div class="aform-assignee">
            <div class="aform-assignee-avatar" id="assignee-avatar" style="background:var(--neutral)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            </div>
            <div class="aform-assignee-body">
              <label for="assignee">Assignee</label>
              <select id="assignee" onchange="updateAssigneeAvatar(this)">
                <option value="" data-initials="—" data-color="var(--neutral)">Unassigned</option>
              </select>
            </div>
            <svg class="aform-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <div class="aform-footer">
          <button type="button" class="btn btn-secondary" onclick="location.href='tasks.html'">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
requireAuth();

/**
 * calendar.html links here with ?due=<ISO datetime> when you click an
 * empty day/slot — pre-fills the Due Date field so "click empty space
 * to create a task" actually works like it does in a real calendar.
 * A plain visit to this page (no query param, e.g. from the Create Task
 * button elsewhere) is unaffected. datetime-local inputs need
 * "YYYY-MM-DDTHH:mm" in *local* time, not a raw ISO string.
 */
(function prefillDueFromQueryParam() {
  const dueParam = new URLSearchParams(location.search).get('due');
  if (!dueParam) return;
  const d = new Date(dueParam);
  if (isNaN(d.getTime())) return;
  const pad = (n) => String(n).padStart(2, '0');
  const local = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('due').value = local;
})();

// Apple-style dropdowns (js/api.js) — the <select> elements stay in the
// DOM as the real data model (hidden), so every .value read below is
// completely unaffected by this. Assignee's whole avatar row is the
// click target rather than just its bare value text, since that row
// is already doing real work (shows the selected person's avatar).
convertSelectToAppleDropdown(document.getElementById('department'));
convertSelectToAppleDropdown(document.getElementById('branch'));
convertSelectToAppleDropdown(document.getElementById('assignee'), { triggerEl: document.querySelector('.aform-assignee') });

let selectedPriority = 'low';
let stagedAttachments = []; // { file, base64 } — uploaded only after the task itself exists

function autoExpand(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function selectPriority(el, value) {
  el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedPriority = value;
}

function updateAssigneeAvatar(select) {
  const opt = select.selectedOptions[0];
  const avatar = document.getElementById('assignee-avatar');
  const initials = opt.dataset.initials;
  const color = opt.dataset.color;
  avatar.style.background = color;
  if (initials === '—') {
    avatar.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
  } else {
    avatar.textContent = initials;
  }
}

function clearTitleError() {
  document.getElementById('title-field').classList.remove('error');
  document.getElementById('title-error').style.display = 'none';
}

function formatFileSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function renderStagedAttachments() {
  const el = document.getElementById('staged-attachments');
  el.innerHTML = stagedAttachments
    .map(
      (a, i) => `
    <div class="attachment-chip">
      <span class="attachment-chip-name">${a.file.name}</span>
      <span class="attachment-chip-size">${formatFileSize(a.file.size)}</span>
      <button type="button" class="attachment-chip-remove" onclick="removeStagedAttachment(${i})" title="Remove">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>`
    )
    .join('');
}

function removeStagedAttachment(index) {
  stagedAttachments.splice(index, 1);
  renderStagedAttachments();
}

/** Reads each picked file as base64 (no resizing — unlike photos,
 * these aren't necessarily images) and stages it client-side; nothing
 * is uploaded until the form is actually submitted, since a file has
 * to attach to a real task id (see handleCreateTaskSubmit). */
async function handleAttachmentsSelected(e) {
  const files = [...e.target.files];
  e.target.value = ''; // allow re-picking the same file name later
  for (const file of files) {
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read that file.'));
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
      });
      stagedAttachments.push({ file, base64 });
    } catch (err) {
      alert(`Couldn't read "${file.name}": ${err.message}`);
    }
  }
  renderStagedAttachments();
}

async function loadFormOptions() {
  const deptSelect = document.getElementById('department');
  const branchSelect = document.getElementById('branch');
  const assigneeSelect = document.getElementById('assignee');
  let me; // hoisted so the assignee-loading block below can filter by it

  try {
    const [departments, meResult] = await Promise.all([Api.departments(), Api.me()]);
    me = meResult;
    if (!me.profileCompletedAt) {
      location.href = 'my-profile.html';
      return;
    }
    deptSelect.innerHTML = departments
      .map(d => `<option value="${d.id}">${d.name}</option>`)
      .join('');
    // Default to the logged-in user's own department rather than
    // whichever loads first alphabetically. Non-admins can only ever
    // *see* their own department's tasks (see queries.py's `tasks` and
    // `dashboard_stats` RBAC scoping) — a task silently created under
    // a different department was invisible on "My Tasks" even though
    // it counted on the dashboard tiles. Still overridable below.
    if (me.department && departments.some(d => d.id === me.department.id)) {
      deptSelect.value = me.department.id;
    }
    deptSelect.appleDropdownSync();
  } catch (err) {
    deptSelect.innerHTML = '<option value="">Failed to load departments</option>';
    deptSelect.appleDropdownSync();
  }

  try {
    // Branch is optional and independent of Department (see the Task
    // model's branch_id comment) — no filtering tie between the two,
    // every branch across every business unit is always offered here.
    // Label includes the business unit whenever there's more than one,
    // since branch names alone aren't guaranteed unique across units.
    const businessUnits = await Api.businessUnits();
    const showUnitName = businessUnits.length > 1;
    const branchOptions = businessUnits.flatMap(bu =>
      bu.branches.map(b => ({ id: b.id, label: showUnitName ? `${b.name} — ${bu.name}` : b.name }))
    );
    branchSelect.innerHTML =
      '<option value="">No branch</option>' +
      branchOptions.map(b => `<option value="${b.id}">${b.label}</option>`).join('');
    branchSelect.appleDropdownSync();
  } catch (err) {
    branchSelect.innerHTML = '<option value="">No branch</option>';
    branchSelect.appleDropdownSync();
  }

  try {
    // Any department's staff can be assigned a task from this form —
    // *except* for a Member, who can only assign to themselves or to
    // another Member in their own department + branch (never "upward"
    // to a Manager/Admin). Enforced server-side regardless (see
    // can_assign_task_to in permissions.py); this filter just keeps a
    // Member from seeing a choice they'd only get rejected for.
    const users = await Api.users();
    const assignable = users.filter(u => isValidAssigneeForMember(me, u));
    assigneeSelect.insertAdjacentHTML(
      'beforeend',
      assignable
        .map(u => `<option value="${u.id}" data-initials="${u.initials}" data-color="${u.avatarColor}">${u.fullName}</option>`)
        .join('')
    );
    assigneeSelect.appleDropdownSync();
  } catch (err) {
    // Non-fatal — "Unassigned" is still a valid choice.
    console.error('Failed to load assignees:', err);
  }

  /**
   * admin.html's Org Structure mind map links here with
   * ?departmentId=<id> (clicking a department) or
   * ?departmentId=<id>&assigneeId=<id> (clicking a person) — the
   * "click to assign a ticket" half of that feature. Applied after
   * both selects are populated above (unlike the ?due= prefill in
   * prefillDueFromQueryParam(), these options don't exist in the DOM
   * until the fetches resolve). Overrides the department default-to-
   * my-own-department logic above on purpose: an explicit department
   * chosen from the org chart should win. A plain visit with neither
   * param is unaffected.
   */
  const params = new URLSearchParams(location.search);
  const departmentIdParam = params.get('departmentId');
  const assigneeIdParam = params.get('assigneeId');
  if (departmentIdParam) {
    deptSelect.value = departmentIdParam;
    deptSelect.appleDropdownSync();
  }
  if (assigneeIdParam) {
    assigneeSelect.value = assigneeIdParam;
    updateAssigneeAvatar(assigneeSelect);
    assigneeSelect.appleDropdownSync();
  }
}

async function handleCreateTaskSubmit(e) {
  e.preventDefault();
  const title = document.getElementById('title').value.trim();
  if (!title) {
    document.getElementById('title-field').classList.add('error');
    document.getElementById('title-error').style.display = 'flex';
    document.getElementById('title').focus();
    return false;
  }

  const departmentId = document.getElementById('department').value;
  const branchId = document.getElementById('branch').value;
  const assigneeId = document.getElementById('assignee').value;
  const description = document.getElementById('desc').value.trim();
  const startDateRaw = document.getElementById('start-date').value;
  const dueRaw = document.getElementById('due').value;
  const submitBtn = e.target.querySelector('button[type="submit"]');

  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating…';

  let newTask;
  try {
    newTask = await Api.createTask({
      title,
      description: description || null,
      departmentId,
      branchId: branchId || null,
      priority: selectedPriority.toUpperCase(),
      // "YYYY-MM-DD" alone parses as UTC midnight in JS (date-only ISO
      // strings are a spec special-case) — appending T00:00:00 forces
      // *local* midnight instead, matching what someone picking "Aug 20"
      // in their own timezone actually means. Same fix already applied
      // to prefillDueFromQueryParam() above for the reverse conversion.
      startDate: startDateRaw ? new Date(`${startDateRaw}T00:00:00`).toISOString() : null,
      dueAt: dueRaw ? new Date(dueRaw).toISOString() : null,
      // durationMinutes intentionally omitted — no picker for it in this
      // form anymore; CreateTaskInput's own schema default (30) applies.
      // Calendar's Week view still uses it, just always at the default
      // for tasks created here (still editable later if that changes).
      assigneeId: assigneeId || null,
    });
  } catch (err) {
    if (err.code === 'FORBIDDEN' || err.message.includes('logged in')) {
      logout();
      return false;
    }
    alert(`Couldn't create the task: ${err.message}`);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Task';
    return false;
  }

  // The task exists now regardless of what happens below — a file
  // can only attach to a real task id, so this couldn't happen any
  // earlier. Any individual attachment failure is surfaced but never
  // blocks navigation: the task itself was created successfully
  // either way, and landing on its detail page (not tasks.html) means
  // whatever did/didn't attach is immediately visible to retry there.
  const failedAttachments = [];
  for (const staged of stagedAttachments) {
    try {
      await Api.addTaskAttachment(newTask.id, staged.file.name, staged.file.type || 'application/octet-stream', staged.base64);
    } catch (err) {
      failedAttachments.push(staged.file.name);
    }
  }
  if (failedAttachments.length > 0) {
    alert(`Task created, but couldn't attach: ${failedAttachments.join(', ')}. You can try attaching again from the task.`);
  }
  location.href = `task-detail.html?id=${newTask.id}`;
  return false;
}

loadFormOptions();
</script>

</body>
</html>
