<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  // Applied before first paint to avoid a flash of the wrong theme --
  // js/api.js (loaded at the end of <body>) is far too late for this.
  // See applyTheme()/setThemeChoice() there for the picker itself.
  (function () {
    var t = localStorage.getItem("hnbg_theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  })();
</script>
<title>Sign In — HNBG</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <img src="hnbg-mark.png" alt="HNBG" style="height:56px;margin:0 auto 8px;display:block" />
    <div class="brand-tagline" style="justify-content:center;display:flex;gap:4px;margin-bottom:6px"><span class="c-blue">Hokkaido</span> <span class="c-blue">Nepal</span> <span class="c-red">Business</span> <span class="c-red">Group</span></div>
    <div class="brand-subtitle" style="font-size:13px;margin-bottom:6px"><span class="c-blue">HN</span><span class="c-red">BG</span> <span class="brand-tms">TMS</span></div>
    <div class="login-subtitle">Enterprise task management, simplified.</div>

    <form id="login-form" onsubmit="return handleLoginSubmit(event)">
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" type="email" placeholder="you@company.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required />
      </div>
      <div id="login-error" style="display:none;color:var(--danger);font-size:13px;margin:-4px 0 12px">
        Invalid email or password.
      </div>
      <div class="field-row">
        <label class="checkbox-row">
          <input type="checkbox" style="margin:0" /> Keep me signed in
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <button id="login-submit" type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
    </form>

    <div class="divider">or continue with</div>

    <button class="sso-btn" onclick="alert('SSO isn\'t wired up in this environment yet — sign in with a work email and password above.')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.25 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.43.34-2.09V7.06H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.94l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google Workspace
    </button>
    <button class="sso-btn" onclick="alert('SSO isn\'t wired up in this environment yet — sign in with a work email and password above.')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#00A4EF" d="M2 2h9.5v9.5H2z"/><path fill="#7FBA00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#F25022" d="M2 12.5h9.5V22H2z"/><path fill="#FFB900" d="M12.5 12.5H22V22h-9.5z"/></svg>
      Microsoft SSO
    </button>

    <div class="login-footer">Protected by enterprise SSO &amp; 2FA · <a href="#" style="color:var(--accent)">Contact IT</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
async function handleLoginSubmit(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit');

  errorBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  try {
    await Api.login(email, password);
    location.href = 'dashboard.html';
  } catch (err) {
    errorBox.textContent = err.code === 'INVALID_CREDENTIALS' || err.code === 'FORBIDDEN'
      ? 'Invalid email or password.'
      : err.message;
    errorBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In';
  }
  return false;
}
</script>

</body>
</html>
