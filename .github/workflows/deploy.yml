name: Prototype CI

# Starter pipeline for the design-phase prototype. Extend the "build" stage
# once this repo grows a real app (framework build, tests, type-checking)
# instead of static HTML/CSS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    name: Lint HTML/CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken relative links in prototypes
        run: |
          set -e
          for f in prototypes/web/*.html; do
            echo "Checking $f"
            grep -oE 'href="[a-zA-Z0-9_./-]+\.html"' "$f" | sed 's/href="//;s/"$//' | while read -r link; do
              if [ ! -f "prototypes/web/$link" ]; then
                echo "::error file=$f::Broken link to $link"
                exit 1
              fi
            done
          done

      - name: Verify tag balance (sanity check)
        run: |
          python3 - <<'PY'
          import glob, sys
          failed = False
          for path in glob.glob("prototypes/**/*.html", recursive=True) + glob.glob("components/**/*.html", recursive=True):
              s = open(path).read()
              if s.count("<div") != s.count("</div>"):
                  print(f"::error file={path}::Unbalanced <div> tags")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  deploy-preview:
    name: Deploy to GitHub Pages
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Static prototype only — no build step needed. Note this serves
      # prototypes/web as the site root, so js/api.js's GraphQL calls to
      # http://localhost:8000/graphql will fail with no local backend
      # running; the pages render, but data stays on "—"/empty states.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
