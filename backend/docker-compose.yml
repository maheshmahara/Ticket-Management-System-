services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hnbg
      POSTGRES_PASSWORD: hnbg
      POSTGRES_DB: hnbg_task_management
    ports:
      - "5432:5432"
    volumes:
      - hnbg_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app
    command: celery -A app.core.celery_app worker --loglevel=info

volumes:
  hnbg_pg_data:
